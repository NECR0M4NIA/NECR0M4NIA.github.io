name: Deploying project on GH Pages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: testing ls
        run: ls -al
      - name: Checkout
        uses: actions/checkout@v4
      - name: testing ls
        run: ls -al
      - name: Installing dependencies
        run: npm install
      - name: Building the app
        run: npm run build
        uses: JamesIves/github-pages-deploy-action@v4.4.3
        with:
          branch: gh-pages
          folder: "dist"